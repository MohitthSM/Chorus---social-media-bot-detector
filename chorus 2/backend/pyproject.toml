[project]
name = "chorus"
version = "0.1.0"
description = "Backend for Chorus: detects coordinated inauthentic activity and abuse-heavy accounts from what extension users see."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "networkx>=3.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "joblib>=1.3",
]

[project.optional-dependencies]
train = ["pandas>=2.0"]
transformers = ["transformers>=4.40", "torch>=2.2"]
dev = ["pytest>=8", "httpx>=0.27", "pandas>=2.0"]

[project.scripts]
chorus-backend = "chorus.api:main"

[tool.setuptools]
packages = ["chorus"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["chorus", "conftest"]
